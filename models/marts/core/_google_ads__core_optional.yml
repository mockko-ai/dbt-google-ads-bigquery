version: 2

models:
  - name: dim_google_ads__demographic
    description: "One row per demographic criterion (age range, gender or parental status) per ad group, unioned with a demographic_type column."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - demographic_key
    columns:
      - name: demographic_key
        description: "Surrogate key for the demographic criterion: type, customer, ad group and criterion id."
        tests:
          - not_null
          - unique
      - name: demographic_type
        description: "age_range, gender or parental_status."
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: campaign_id
        description: "Google Ads campaign id."
      - name: ad_group_id
        description: "Google Ads ad group id."
      - name: criterion_id
        description: "Criterion id of the target. Repeats across ad groups."
      - name: demographic_value
        description: "Value of the demographic criterion (for example AGE_RANGE_25_34, MALE, PARENT)."
      - name: is_negative
        description: "True for a negative keyword."
      - name: status
        description: "Status as of the latest snapshot."
      - name: bid_modifier
        description: "Bid modifier of the target."

  - name: dim_google_ads__audience_target
    description: "One row per audience target at ad group or campaign level. The audience reports carry no audience name and no id that links to ads_Audience, so no name is available."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - audience_target_key
    columns:
      - name: audience_target_key
        description: "Surrogate key for the audience target: level, customer, campaign or ad group and criterion id."
        tests:
          - not_null
          - unique
      - name: level
        description: "ad_group or campaign: the level the audience target is attached to."
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: campaign_id
        description: "Google Ads campaign id."
      - name: ad_group_id
        description: "Google Ads ad group id."
      - name: criterion_id
        description: "Criterion id of the target. Repeats across ad groups."
      - name: status
        description: "Status as of the latest snapshot."
      - name: bid_modifier
        description: "Bid modifier of the target."

  - name: dim_google_ads__placement
    description: "One row per placement (website, app or channel) targeted or excluded in an ad group."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - placement_key
    columns:
      - name: placement_key
        description: "Surrogate key for the placement: customer, ad group and criterion id."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: campaign_id
        description: "Google Ads campaign id."
      - name: ad_group_id
        description: "Google Ads ad group id."
      - name: criterion_id
        description: "Criterion id of the target. Repeats across ad groups."
      - name: placement_url
        description: "Placement URL (website, app or channel)."
      - name: is_negative
        description: "True for a negative keyword."
      - name: status
        description: "Status as of the latest snapshot."
      - name: bid_modifier
        description: "Bid modifier of the target."

  - name: dim_google_ads__video
    description: "One row per video per ad group, from the latest snapshot."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - video_key
    columns:
      - name: video_key
        description: "Surrogate key for the video: customer, ad group and video id."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: campaign_id
        description: "Google Ads campaign id."
      - name: ad_group_id
        description: "Google Ads ad group id."
      - name: video_id
        description: "YouTube video id."
      - name: title
        description: "Video title."
      - name: duration_millis
        description: "Video duration in milliseconds."
      - name: ad_status
        description: "Status of the video ad."

  - name: dim_google_ads__asset
    description: "One row per asset. The asset report has no customer_id, so it is read from the source table name."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_key
    columns:
      - name: asset_key
        description: "Surrogate key for the asset."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: asset_id
        description: "Asset id (parsed from a resource name where needed)."
      - name: name
        description: "Name."
      - name: type
        description: "Type."
      - name: source
        description: "Source of the asset (advertiser or automatically created)."
      - name: final_urls
        description: "Final URLs."

  - name: dim_google_ads__asset_group
    description: "One row per Performance Max asset group. The campaign id is parsed from the asset group campaign resource name."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_group_key
    columns:
      - name: asset_group_key
        description: "Surrogate key for the asset group."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: campaign_id
        description: "Google Ads campaign id."
      - name: asset_group_id
        description: "Performance Max asset group id."
      - name: name
        description: "Name."
      - name: status
        description: "Status as of the latest snapshot."
      - name: final_urls
        description: "Final URLs."
      - name: final_mobile_urls
        description: "Final mobile URLs."

  - name: bridge_google_ads__asset_group_asset
    description: "Bridge between Performance Max asset groups and assets with the asset role (field type)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - asset_group_asset_key
    columns:
      - name: asset_group_asset_key
        description: "Surrogate key for the asset group and asset pair, with the asset field type."
        tests:
          - not_null
          - unique
      - name: asset_group_key
        description: "Surrogate key for the asset group."
        tests:
          - not_null
          - relationships:
              to: ref('dim_google_ads__asset_group')
              field: asset_group_key
              config:
                severity: warn
      - name: asset_key
        description: "Surrogate key for the asset."
        tests:
          - not_null
          - relationships:
              to: ref('dim_google_ads__asset')
              field: asset_key
              config:
                severity: warn
      - name: customer_id
        description: "Google Ads customer (account) id."
        tests:
          - not_null
      - name: asset_group_id
        description: "Performance Max asset group id."
        tests:
          - not_null
      - name: asset_id
        description: "Asset id (parsed from a resource name where needed)."
        tests:
          - not_null
      - name: field_type
        description: "Role of the asset in the group (HEADLINE, LONG_HEADLINE, MARKETING_IMAGE, ...)."
      - name: source
        description: "Source of the asset (advertiser or automatically created)."
      - name: approval_status
        description: "Policy approval status."

  - name: dim_google_ads__bidding_strategy
    description: "One row per portfolio bidding strategy from the latest snapshot."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - bidding_strategy_key
    columns:
      - name: bidding_strategy_key
        description: "Surrogate key for the portfolio bidding strategy."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Google Ads customer (account) id."
      - name: bidding_strategy_id
        description: "Portfolio bidding strategy id."
      - name: name
        description: "Name."
      - name: type
        description: "Type."
      - name: status
        description: "Status as of the latest snapshot."
      - name: target_cpa
        description: "Target CPA in account currency."
      - name: target_roas
        description: "Target ROAS."
      - name: target_spend
        description: "Target spend (maximize clicks) in account currency."

  - name: fct_google_ads__demographic_daily
    description: "Rolled up from demographic_device_network_daily: ad_network_type, device summed out. Additive metrics only."
