      - name: date_day
        description: "Calendar day (segments.date) in the account time zone."
        tests:
          - not_null
          - relationships:
              to: ref('dim_google_ads__date')
              field: date_day
              config:
                severity: warn
      - name: device
        description: "Device segment (MOBILE, DESKTOP, TABLET, ...)."
        tests:
          - not_null
      - name: ad_network_type
        description: "Ad network type segment (SEARCH, CONTENT, YOUTUBE_WATCH, ...)."
        tests:
          - not_null
      - name: impressions
        description: "Impressions (additive)."
      - name: clicks
        description: "Clicks (additive)."
      - name: interactions
        description: "Interactions (additive)."
      - name: cost
        description: "Cost in account currency (additive). Converted from micros."
      - name: conversions
        description: "Conversions, possibly fractional (additive)."
      - name: conversions_value
        description: "Conversion value in account currency (additive)."
      - name: view_through_conversions
        description: "View-through conversions (additive)."

