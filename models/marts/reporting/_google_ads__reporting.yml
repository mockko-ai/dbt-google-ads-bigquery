        description: "Conversions for the action."
      - name: conversions_value
        description: "Conversions value for the action."

  - name: rpt_google_ads__keyword_conversion_actions
    description: >
      Reference table: conversions by conversion action. One row per keyword, day and conversion action,
      with the action name and category and the names of the keyword and its parents. Device, network and click type are
      summed out. It has no clicks or cost, because they would repeat per action row: use
      rpt_google_ads__keyword_daily for those, or rpt_google_ads__keyword_conversion_daily for chosen actions side by side.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_id
            - ad_group_id
            - keyword_id
            - date_day
            - conversion_action_key
    columns:
      - name: customer_id
        description: "Google Ads id."
        tests: [not_null]
      - name: ad_group_id
        description: "Google Ads id."
        tests: [not_null]
      - name: keyword_id
        description: "Google Ads id."
        tests: [not_null]
      - name: date_day
        description: "Day of the conversion stats."
        tests: [not_null]
      - name: conversion_action_key
        description: "Surrogate key of the conversion action (customer plus resource name)."
      - name: conversion_action_name
        description: "Conversion action name (latest snapshot)."
      - name: conversion_action_category
        description: "Conversion action category (latest snapshot)."
      - name: conversions
        description: "Conversions for the action."
      - name: conversions_value
        description: "Conversions value for the action."
