  - name: rpt_google_ads__account_conversion_daily
    description: >
      Disabled unless var google_ads_pivot_conversion_actions lists at least one conversion action name.
      rpt_google_ads__account_daily plus, for each listed action, <slug>_conversions, <slug>_conversions_value,
      <slug>_cvr, <slug>_cpa and <slug>_roas (slug = lower-cased action name with non-alphanumerics as underscores).
      Still one row per account and day, so every measure stays additive. Actions with no data give zeros,
      so the schema depends only on the list. Intended for BI use.
    tests:
