  - name: rpt_google_ads__account_conversion_actions
    description: >
      Reference table: conversions by conversion action. One row per account, day and conversion action,
      with the action name and category and the names of the account and its parents. Device, network and click type are
      summed out. It has no clicks or cost, because they would repeat per action row: use
      rpt_google_ads__account_daily for those, or rpt_google_ads__account_conversion_daily for chosen actions side by side.
    tests:
      - dbt_utils.unique_combination_of_columns:
